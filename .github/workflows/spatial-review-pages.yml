name: Publish Slop New York Spatial Review

on:
  push:
    branches:
      - feat/spatial-review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slop-newyork-github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Test and build static site
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.release.outputs.build_id }}
      bundle_sha: ${{ steps.release.outputs.bundle_sha }}
      index_sha: ${{ steps.release.outputs.index_sha }}
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build ordinary site and isolated capture
        run: npm run build

      - name: Record exact release identity
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const sha = file => createHash('sha256').update(readFileSync(file)).digest('hex');
          appendFileSync(process.env.GITHUB_OUTPUT,
            `build_id=${JSON.parse(readFileSync('dist/spatial-review/build.json')).buildId}\n` +
            `bundle_sha=${sha('dist/spatial-review/capture.js')}\n` +
            `index_sha=${sha('dist/index.html')}\n`);
          NODE

      - name: Check Pages subdirectory paths and static discovery
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';
          import { normalizeSpatialReviewDiscovery } from '@alterno-dev/spatial-review';
          const [owner, name] = process.env.GITHUB_REPOSITORY.split('/');
          const website = `https://${owner}.github.io/${name}/`;
          const discoveryUrl = new URL('.well-known/spatial-review.json', website).href;
          const discovery = JSON.parse(readFileSync('dist/.well-known/spatial-review.json', 'utf8'));
          const resolved = normalizeSpatialReviewDiscovery(discovery, discoveryUrl);
          assert.equal(resolved.websiteUrl, website);
          assert.equal(resolved.liveCapture, new URL('spatial-review.html', website).href);
          for (const file of ['index.html', 'spatial-review.html', 'spatial-review/capture.js',
            'spatial-review/build.json', 'js/landmarks.js', 'js/cameras.js', 'css/style.css']) {
            assert.ok(existsSync(`dist/${file}`), `Missing publishable file ${file}`);
          }
          assert.match(readFileSync('dist/spatial-review.html', 'utf8'),
            /src="\.\/spatial-review\/capture\.js"/);
          console.log('GitHub Pages paths and discovery validated:', website);
          NODE

      - name: Install Chromium for transport acceptance
        run: npx playwright install --with-deps chromium

      - name: Verify browser discovery, scene, texture, refresh and teardown
        run: npm run test:browser

      - name: Disable Jekyll (preserve .well-known discovery)
        run: touch dist/.nojekyll

      - name: Assert required hidden files are present before publishing
        run: |
          test -s dist/.well-known/spatial-review.json
          test -f dist/.nojekyll

      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # Supported since v5: publish .well-known/ and .nojekyll.
          include-hidden-files: true

      - name: Verify the actual Pages archive includes discovery
        run: |
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx './.well-known/spatial-review.json'
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx './.nojekyll'

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Verify GitHub Pages is enabled for Actions
        uses: actions/configure-pages@v5

      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live discovery, framing and exact release files
        timeout-minutes: 5
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_BUILD: ${{ needs.build.outputs.build_id }}
          EXPECTED_BUNDLE_SHA: ${{ needs.build.outputs.bundle_sha }}
          EXPECTED_INDEX_SHA: ${{ needs.build.outputs.index_sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const base = new URL(process.env.SITE_URL);
          if (!base.pathname.endsWith('/')) base.pathname += '/';
          const editor = 'https://spatial-review.alterno.dev';
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          let failure;
          for (let attempt = 0; attempt < 18; attempt++) {
            const get = async path => {
              const url = new URL(path, base);
              url.searchParams.set('verify', `${process.env.GITHUB_SHA}-${attempt}`);
              const response = await fetch(url, { headers: { Origin: editor }, signal: AbortSignal.timeout(15000) });
              assert.equal(response.status, 200, `${path}: HTTP ${response.status}`);
              return response;
            };
            try {
              const manifest = await (await get('spatial-review/build.json')).json();
              assert.equal(manifest.buildId, process.env.EXPECTED_BUILD, 'Pages is serving a different build');
              const discoveryResponse = await get('.well-known/spatial-review.json');
              assert.match(discoveryResponse.headers.get('content-type') ?? '', /application\/json/);
              assert.ok(['*', editor].includes(discoveryResponse.headers.get('access-control-allow-origin')), 'Discovery must be readable by the approved editor');
              const discovery = await discoveryResponse.json();
              assert.equal(discovery.schema, 'spatial-review-discovery/v1');
              const discoveryUrl = new URL('.well-known/spatial-review.json', base);
              assert.equal(new URL(discovery.websiteUrl, discoveryUrl).href, base.href);
              assert.equal(new URL(discovery.liveCapture, discoveryUrl).href, new URL('spatial-review.html', base).href);
              const capture = await get('spatial-review.html');
              assert.equal(capture.headers.get('x-frame-options'), null, 'Capture framing is blocked');
              assert.match(await capture.text(), /complete city geometry/);
              const bundle = Buffer.from(await (await get('spatial-review/capture.js')).arrayBuffer());
              const index = Buffer.from(await (await get('index.html')).arrayBuffer());
              assert.equal(sha(bundle), process.env.EXPECTED_BUNDLE_SHA, 'Published capture bundle differs from the tested bundle');
              assert.equal(sha(index), process.env.EXPECTED_INDEX_SHA, 'Published ordinary page differs from the tested page');
              console.log(JSON.stringify({ result: 'PASS', website: base.href, buildId: manifest.buildId,
                discovery: discoveryUrl.href, capture: new URL('spatial-review.html', base).href,
                exactBundle: true, exactOrdinaryPage: true, discoveryCORS: true }, null, 2));
              failure = undefined;
              break;
            } catch (error) {
              failure = error;
              console.warn(`Public deployment check ${attempt + 1}/18: ${error.message}`);
              if (attempt < 17) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          if (failure) throw failure;
          NODE
